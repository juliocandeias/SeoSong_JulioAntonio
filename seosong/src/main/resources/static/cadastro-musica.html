<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Música - SeoSong</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #1f2937;
        }

        .container { width: 100%; max-width: 600px; }

        .header { margin-bottom: 24px; }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            color: #111827;
        }

        .header p {
            margin: 7px 0 0;
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow:
                0 4px 6px rgba(0,0,0,.03),
                0 10px 30px rgba(0,0,0,.06);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus {
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(17,24,39,.08);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #374151; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }

        #message {
            margin: 18px 0 0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        #message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        #message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        @media (max-width: 550px) {
            .card { padding: 24px 20px; }
            .header h1 { font-size: 26px; }
            .row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
    <link rel="stylesheet" href="app.css">
    <script src="app-shell.js" defer></script>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Cadastro de Música</h1>
        <p>Cadastre uma nova música no SeoSong.</p>
    </div>

    <div class="card">

        <form id="songForm">

            <div class="form-group">
                <label for="name">Nome da música</label>
                <input type="text" id="name" placeholder="Ex.: Sparkle" required
                maxlength="255">
            </div>

            <div class="form-group">
                <label for="artistId">ID do artista</label>
                <input type="number" id="artistId" placeholder="Ex.: 1" min="1" required>
            </div>

            <div class="form-group">
                <label for="album">Álbum</label>
                <input type="text" id="album" placeholder="Ex.: Your Name"
                maxlength="255">
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="year">Ano</label>
                    <input type="number" id="year" placeholder="Ex.: 2016">
                </div>

                <div class="form-group">
                    <label for="duration">Duração (segundos)</label>
                    <input type="number" id="duration" placeholder="Ex.: 300">
                </div>

            </div>

            <div class="form-group">
                <label for="genre">Gênero</label>
                <input type="text" id="genre" placeholder="Ex.: J-Pop">
            </div>

            <div class="form-group">
                <label for="photo">URL da foto</label>
                <input type="url" id="photo" placeholder="https://exemplo.com/foto.jpg"
                maxlength="255">
            </div>

            <button type="submit" id="submitButton">
                Cadastrar música
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>

<script>
    const form = document.getElementById("songForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "Cadastrando...";

        const song = {
            name: document.getElementById("name").value,
            artist: {
                id: Number(document.getElementById("artistId").value)
            },
            album: document.getElementById("album").value,
            year: Number(document.getElementById("year").value) || 0,
            duration: Number(document.getElementById("duration").value) || 0,
            genre: document.getElementById("genre").value,
            photo: document.getElementById("photo").value
        };

        try {

            const response = await fetch(
                "http://localhost:8081/songs",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(song)
                }
            );

            if (response.ok) {

                const savedSong = await response.json();

                message.className = "success";
                message.textContent =
                    "✓ Música cadastrada com sucesso! ID: " + savedSong.id;

                form.reset();

            } else {

                const errorText = await response.text();

                message.className = "error";
                message.textContent =
                    "Não foi possível cadastrar a música.";

                console.error(errorText);
            }

        } catch (error) {

            console.error(error);

            message.className = "error";
            message.textContent =
                "Erro ao conectar com o servidor.";

        }

        submitButton.disabled = false;
        submitButton.textContent = "Cadastrar música";
    });
</script>

</body>
</html>
