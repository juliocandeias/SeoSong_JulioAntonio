<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil do Usuário</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f5f7;

            color: #1f2937;

        }


        .container {

            width: 100%;

            max-width: 850px;

            margin: 0 auto;

            padding: 40px 24px;

        }


        /* HEADER */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .title h1 {

            margin: 0;

            font-size: 30px;

            color: #111827;

        }


        .title p {

            margin: 6px 0 0;

            color: #6b7280;

        }


        .back-button {

            display: inline-block;

            padding: 10px 16px;

            border-radius: 8px;

            background: #111827;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: background 0.2s;

        }


        .back-button:hover {

            background: #374151;

        }


        /* PROFILE CARD */

        .profile-card {

            background: white;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.06);

        }


        /* PROFILE HEADER */

        .profile-header {

            padding: 35px;

            display: flex;

            align-items: center;

            gap: 22px;

            border-bottom: 1px solid #eeeeee;

        }


        .profile-photo {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            object-fit: cover;

            background: #e5e7eb;

            border: 4px solid #f3f4f6;

        }


        .profile-name {

            margin: 0;

            font-size: 25px;

            color: #111827;

        }


        .profile-email {

            margin-top: 7px;

            color: #6b7280;

        }


        .profile-id {

            display: inline-block;

            margin-top: 12px;

            padding: 5px 9px;

            border-radius: 6px;

            background: #f3f4f6;

            color: #6b7280;

            font-size: 12px;

            font-weight: 600;

        }


        /* INFORMATION */

        .information {

            padding: 30px 35px;

        }


        .information h2 {

            margin: 0 0 20px;

            font-size: 18px;

            color: #111827;

        }


        .information-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;

        }


        .info-item {

            padding: 17px;

            border: 1px solid #eeeeee;

            border-radius: 10px;

            background: #fafafa;

        }


        .info-label {

            margin-bottom: 6px;

            font-size: 12px;

            text-transform: uppercase;

            color: #9ca3af;

            font-weight: 600;

        }


        .info-value {

            font-size: 15px;

            color: #374151;

            font-weight: 500;

        }


        /* LOADING */

        .loading {

            padding: 80px 20px;

            text-align: center;

            color: #6b7280;

        }


        /* ERROR */

        .error {

            padding: 80px 20px;

            text-align: center;

            color: #dc2626;

        }


        .error strong {

            display: block;

            margin-bottom: 8px;

        }


        /* MOBILE */

        @media (max-width: 650px) {

            .container {

                padding: 25px 15px;

            }


            .header {

                align-items: flex-start;

                gap: 15px;

            }


            .title h1 {

                font-size: 25px;

            }


            .profile-header {

                padding: 25px;

                flex-direction: column;

                text-align: center;

            }


            .information {

                padding: 25px;

            }


            .information-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

    <link rel="stylesheet" href="app.css">
    <script src="app-shell.js" defer></script>
</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="title">

            <h1>Perfil do Usuário</h1>

            <p>Informações cadastrais</p>

        </div>


        <a
            href="listar.html"
            class="back-button"
        >
            ← Voltar
        </a>

    </div>



    <!-- PROFILE -->

    <div
        id="profile"
        class="profile-card"
    >

        <div class="loading">

            Carregando perfil...

        </div>

    </div>


</div>



<script>


    const API_URL = "http://localhost:8081/users";


    const profile =
        document.getElementById("profile");


    /*
     * Pega o ID da URL.
     *
     * Exemplo:
     *
     * profile.html?id=1
     *
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const userId =
        params.get("id");



    async function loadProfile() {


        // Verifica se existe ID

        if (!userId) {

            showError(
                "ID do usuário não informado."
            );

            return;

        }


        try {


            const response =
                await fetch(
                    `${API_URL}/${userId}`
                );


            if (!response.ok) {

                if (response.status === 404) {

                    throw new Error(
                        "Usuário não encontrado."
                    );

                }

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const user =
                await response.json();


            renderProfile(user);


        } catch (error) {


            console.error(error);


            showError(
                error.message
            );

        }

    }



    function formatDate(dateString) {


        if (!dateString) {

            return "-";

        }


        const date =
            new Date(dateString);


        return date.toLocaleDateString(
            "pt-BR"
        );

    }



    function renderProfile(user) {


        const name =
            user.name || "Sem nome";


        const email =
            user.email || "-";


        const photo =
            user.photo ||
            "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(name);


        profile.innerHTML = `

            <!-- PROFILE HEADER -->

            <div class="profile-header">


                <img

                    class="profile-photo"

                    src="${photo}"

                    alt="${name}"

                    onerror="
                        this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}'
                    "

                >


                <div>


                    <h2 class="profile-name">

                        ${name}

                    </h2>


                    <div class="profile-email">

                        ${email}

                    </div>


                    <span class="profile-id">

                        ID #${user.id}

                    </span>


                </div>


            </div>



            <!-- INFORMATION -->

            <div class="information">


                <h2>

                    Informações pessoais

                </h2>


                <div class="information-grid">


                    <div class="info-item">

                        <div class="info-label">

                            Nome

                        </div>

                        <div class="info-value">

                            ${name}

                        </div>

                    </div>



                    <div class="info-item">

                        <div class="info-label">

                            E-mail

                        </div>

                        <div class="info-value">

                            ${email}

                        </div>

                    </div>



                    <div class="info-item">

                        <div class="info-label">

                            Data de nascimento

                        </div>

                        <div class="info-value">

                            ${formatDate(user.birthDate)}

                        </div>

                    </div>



                    <div class="info-item">

                        <div class="info-label">

                            CEP

                        </div>

                        <div class="info-value">

                            ${user.cep || "-"}

                        </div>

                    </div>



                    <div class="info-item">

                        <div class="info-label">

                            Foto

                        </div>

                        <div class="info-value">

                            ${user.photo || "-"}

                        </div>

                    </div>


                </div>

            </div>

        `;

    }



    function showError(message) {


        profile.innerHTML = `

            <div class="error">

                <strong>

                    Não foi possível carregar o perfil.

                </strong>


                <span>

                    ${message}

                </span>


                <br><br>


                <a
                    href="index.html"
                    class="back-button"
                >
                    Voltar para usuários
                </a>

            </div>

        `;

    }



    // Carrega o perfil

    loadProfile();


</script>


</body>

</html>
