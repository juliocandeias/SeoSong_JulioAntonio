<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SeoSong</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f5f7;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            margin: 0;

            font-size: 34px;
            font-weight: 700;

            color: #111827;
        }

        .header p {
            margin: 7px 0 0;

            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: white;

            padding: 32px;

            border-radius: 16px;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.03),
                0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            gap: 6px;

            padding: 20px;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            text-decoration: none;
            color: inherit;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                transform 0.1s;
        }

        .nav-item:hover {
            border-color: #111827;

            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
        }

        .nav-item:active {
            transform: scale(0.99);
        }

        .nav-item .icon {
            font-size: 26px;
        }

        .nav-item .title {
            font-size: 16px;
            font-weight: 700;

            color: #111827;
        }

        .nav-item .desc {
            font-size: 13px;

            color: #6b7280;
        }

        .status {
            margin-top: 24px;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 13px;
            text-align: center;

            background: #f4f5f7;
            color: #6b7280;
        }

        .status .dot {
            display: inline-block;

            width: 8px;
            height: 8px;

            margin-right: 6px;

            border-radius: 50%;

            background: #9ca3af;
        }

        .status.online .dot {
            background: #10b981;
        }

        .status.offline .dot {
            background: #ef4444;
        }

        @media (max-width: 550px) {

            .card {
                padding: 24px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎵 SeoSong</h1>
        <p>Gerencie artistas, músicas, playlists e usuários.</p>
    </div>

    <div class="card">

        <div class="grid">

            <a href="cadastro-artista.html" class="nav-item">
                <span class="icon">🎤</span>
                <span class="title">Artistas</span>
                <span class="desc">Cadastrar e listar artistas</span>
            </a>

            <a href="cadastro-musica.html" class="nav-item">
                <span class="icon">🎶</span>
                <span class="title">Músicas</span>
                <span class="desc">Cadastrar e listar músicas</span>
            </a>

            <a href="cadastro-playlist.html" class="nav-item">
                <span class="icon">📀</span>
                <span class="title">Playlists</span>
                <span class="desc">Criar e gerenciar playlists</span>
            </a>

            <a href="cadastro-user.html" class="nav-item">
                <span class="icon">👤</span>
                <span class="title">Usuários</span>
                <span class="desc">Cadastrar e listar usuários</span>
            </a>

        </div>

        <p id="status" class="status">
            <span class="dot"></span>
            <span id="statusText">Verificando servidor...</span>
        </p>

    </div>

</div>

<script>
    // Como este arquivo já é servido pelo próprio Spring Boot,
    // a API está sempre na mesma origem (não precisa de porta fixa).
    const API_BASE = "";

    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");

    fetch(API_BASE + "/playlists")
        .then(function (response) {
            if (response.ok) {
                statusEl.classList.add("online");
                statusText.textContent = "Servidor online";
            } else {
                throw new Error("resposta não ok");
            }
        })
        .catch(function () {
            statusEl.classList.add("offline");
            statusText.textContent = "Servidor offline ou endpoint indisponível";
        });
</script>

</body>

</html>
